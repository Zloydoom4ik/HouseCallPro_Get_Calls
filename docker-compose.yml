# PostgreSQL для звонков.  Поднять: docker compose up -d   Остановить: docker compose down
# Данные живут в томе pgdata и переживают перезапуск контейнера.
services:
  db:
    image: postgres:16
    container_name: hcp_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcp
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: hcp_calls
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: